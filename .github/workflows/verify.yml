name: verify

on:
  push: # run this workflow on every push
  pull_request: # run this workflow on every pull_request
  workflow_dispatch: # allow to manually trigger this workflow

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/viperproject/gobra:sha-06cbbe8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify packages (without hyperMode)
        run: python3 tooling/verify.py --phase unary --out "$RUNNER_TEMP/unary" --no-summary

      - name: Upload Gobra statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unary-stats.json
          path: ${{ runner.temp }}/unary/iter1/unary/stats.json

      - name: Verify packages (with hyperMode)
        run: python3 tooling/verify.py --phase hyper --out "$RUNNER_TEMP/hyper" --no-summary

      - name: Upload Gobra statistics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hyper-stats.json
          path: ${{ runner.temp }}/hyper/iter1/hyper/stats.json


  test-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test all packages
        run: go test ./...


  visualize-times:
    runs-on: ubuntu-latest
    needs: verify-packages
    if: ${{ always() }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download unary statistics
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: unary-stats.json
          path: stats/unary

      - name: Download hyper statistics
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: hyper-stats.json
          path: stats/hyper

      # Phases are checked individually: a run whose hyper phase died still
      # yields a unary report, but that report has to say so -- otherwise it
      # lists only the two cheap packages and looks deceptively healthy.
      - name: Check that at least one stats file was downloaded
        id: stats
        run: |
          missing=""
          [ -f stats/unary/stats.json ] || missing="unary"
          [ -f stats/hyper/stats.json ] || missing="${missing:+$missing, }hyper"
          if [ -z "$missing" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = "unary, hyper" ]; then
            echo "::notice::No stats.json artifacts were downloaded; skipping visualization."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Statistics for the $missing phase are missing; the report covers the remaining phase only."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report
        if: ${{ steps.stats.outputs.skip != 'true' }}
        env:
          MISSING: ${{ steps.stats.outputs.missing }}
        run: |
          python3 tooling/summarize-verification-stats.py stats \
            --summary summary.md \
            ${MISSING:+--missing "$MISSING"}

      - name: Append summary to job summary
        if: ${{ steps.stats.outputs.skip != 'true' }}
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ steps.stats.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-times
          path: summary.md

      # Sticky PR comment: update the existing comment carrying the marker
      # instead of posting a new one on every run. Fork PRs lack write
      # permission, hence continue-on-error.
      - name: Post or update PR comment
        if: ${{ github.event_name == 'pull_request' && steps.stats.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # JSON-encode the comment body safely (no string interpolation).
          jq -Rs '{body: .}' summary.md > "$RUNNER_TEMP/body.json"
          # --paginate walks all pages; --jq is applied per page, so ids from
          # every page are emitted and head -n 1 picks the first match.
          comment_id="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- verification-times -->")) | .id' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/body.json"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$RUNNER_TEMP/body.json"
          fi
